name: build

# Builds the host side and the v73/v75/v79/v81 skels with the public Snapdragon
# toolchain containers (Hexagon SDK 6.6), which keeps the other HTP generations
# building. The FuSa configuration needs an older SDK and the firmware's SWIV
# utility, which these containers do not have; it is built outside CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container: ghcr.io/snapdragon-toolchain/${{ matrix.image }}:v0.7
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            image: arm64-android
            preset: arm64-android-release
          - target: linux
            image: arm64-linux
            preset: arm64-linux-release
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Configure
        run: |
          git config --global --add safe.directory '*'
          cmake --preset ${{ matrix.preset }} -B build -DGGML_HEXAGON_SENSEVOICE=ON

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Package
        run: scripts/package.sh --split build pkg

      - uses: actions/upload-artifact@v6
        with:
          name: ggml-hexagon-fusa-${{ matrix.target }}
          path: pkg

  sensevoice-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy==1.26.4 PyYAML==6.0.2
      - name: Build CPU runtime
        run: |
          cmake -S sensevoice -B build-sensevoice-cpu -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sensevoice-cpu -j 2
      - name: Test backend, reference inference and packaging
        run: |
          ctest --test-dir build-sensevoice-cpu/sensevoice-build --output-on-failure
          python sensevoice/tests/test_cli.py --binary build-sensevoice-cpu/sensevoice-build/bin/llama-funasr-sensevoice --llama llama.cpp
          python sensevoice/tests/test_package.py
